[package]
name = "vertx-rs"
version = "0.3.0"
edition = "2024"
rust-version = "1.100.0"
description = "Rust + Tokio port of Vert.x core: EventLoop-affine Verticle + WorkerVerticle + EventBus"
license = "Apache-2.0"

[workspace]
resolver = "3"
members = ["adapters/axum"]
default-members = ["."]

[dependencies]
tokio = { version = "1.54.0", features = ["rt", "sync", "macros", "time", "net"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
dashmap = "6.2.1"
async-trait = "0.1.92"
thiserror = "2.0.21"
futures = "0.3.34"
tracing = "0.1.44"

[dev-dependencies]
rstest = { version = "0.28.0", default-features = false }
tokio = { version = "1.54.0", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[[example]]
name = "ping_pong"
path = "examples/ping_pong.rs"

[[example]]
name = "pipeline"
path = "examples/pipeline.rs"

[[example]]
name = "verticle_to_verticle"
path = "examples/verticle_to_verticle.rs"

[[example]]
name = "bounded_mailbox"
path = "examples/bounded_mailbox.rs"

[[example]]
name = "deployment_rollback"
path = "examples/deployment_rollback.rs"

[[example]]
name = "external_dispatch"
path = "examples/external_dispatch.rs"

[[example]]
name = "graceful_shutdown"
path = "examples/graceful_shutdown.rs"

[[example]]
name = "deferred_reply"
path = "examples/deferred_reply.rs"

[[example]]
name = "error_handling"
path = "examples/error_handling.rs"

[[example]]
name = "tcp_shared_listener"
path = "examples/tcp_shared_listener.rs"
