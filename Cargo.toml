[package]
name = "vertx-rs"
version = "0.3.0"
edition = "2021"
rust-version = "1.96"
resolver = "3"
description = "Rust + Tokio port of Vert.x core: EventLoop-affine Verticle + WorkerVerticle + EventBus"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.54.0", features = ["rt", "sync", "macros", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
dashmap = "6.2.1"
async-trait = "0.1.92"
thiserror = "2.0.21"
futures = "0.3.34"
tracing = "0.1.44"

[dev-dependencies]
rstest = { version = "0.28.0", default-features = false }
tokio = { version = "1.54.0", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[[example]]
name = "ping_pong"
path = "examples/ping_pong.rs"

[[example]]
name = "pipeline"
path = "examples/pipeline.rs"

[[example]]
name = "verticle_to_verticle"
path = "examples/verticle_to_verticle.rs"
